<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Administrator Register</title>
    <link rel="stylesheet" type="text/css" href="/css/adminStyle.css">
</head>
<body>
    <div class="container">
        <div class="adminRegister-container">
            <h2><i>Administrator Register</i></h2>
            <form action="#" th:action="@{/adminRegister}" method="post">
                <div>
                    <label for="adminName">name</label>
                    <input type="text" id="adminName" name="adminName" required>
                </div>
                <div>
                    <label for="adminPassword">password</label>
                    <input type="adminPassword" id="adminPassword" name="adminPassword" required>
                </div>
                <button type="submit"><i>register</i></button>
            </form>
        </div>
    </div>
</body>
</html>
